# render.yaml - One-click deployment blueprint for Render
# Learn more: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: email-finder
    env: node
    plan: free
    region: oregon  # or your preferred region
    buildCommand: ""  # No build step needed
    startCommand: node server.js
    healthCheckPath: /health
    autoDeploy: true  # Auto-deploy on git push
    
    # Environment variables (none required, but here for reference)
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"  # Render uses port 10000 by default
    
    # Free tier settings
    numInstances: 1
    disk: null  # No persistent disk needed
    
    # Optional: custom domain (uncomment and configure in Render dashboard)
    # domains:
    #   - email.yourdomain.com
